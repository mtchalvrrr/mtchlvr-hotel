spring.application.name=mtchlvr-hotel
server.port=8080

# SQLite local database. DATABASE_URL may be overridden by an environment variable.
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:./data/mtchlvr-hotel.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# Mail settings are optional during initial setup. Configure environment variables before enabling email features.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Integrations are read from environment variables; never hard-code secrets here.
app.groq.api-key=${GROQ_API_KEY:}
app.recaptcha.site-key=${RECAPTCHA_SITE_KEY:}
app.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
app.mail.from=${MAIL_FROM:}
